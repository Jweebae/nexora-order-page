
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>Nexora | اطلب منتجك</title>
  <meta name="description" content="اكتشف منتجات Nexora واطلب بكل سهولة.">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #171717;
      line-height: 1.7;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 27px;
      letter-spacing: 1px;
    }

    header p {
      margin: 3px 0 0;
      color: #ccc;
      font-size: 14px;
    }

    main {
      max-width: 520px;
      margin: 24px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 5px 24px #0000000a;
    }

    .product {
      background: #eeeeee;
      border-radius: 12px;
      padding: 25px 15px;
      text-align: center;
      margin-bottom: 20px;
    }

    .product h2 { margin: 0 0 5px; }

    .product p {
      margin: 0;
      color: #666;
      font-size: 14px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 14px 0 5px;
    }

    input, select, textarea {
      display: block;
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 9px;
      font: inherit;
      background: white;
    }

    input:focus, select:focus, textarea:focus {
      outline: 2px solid #555;
      outline-offset: 1px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 14px;
      margin-top: 22px;
      background: #111;
      color: white;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #status {
      margin-top: 14px;
      text-align: center;
    }

    footer {
      text-align: center;
      color: #777;
      padding: 20px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <h1>NEXORA</h1>
    <p>منتجات مميزة لحياتك اليومية</p>
  </header>

  <main>
    <section class="card">
      <div class="product">
        <h2>مصباح Nexora</h2>
        <p>اكتشف المنتج وتواصل معنا لتأكيد طلبك.</p>
        <p>السعر: يُحدّد لاحقًا</p>
      </div>

      <h2>اطلب الآن</h2>
      <p>عمّر المعلومات التالية، وفريقنا يتواصل معاك لتأكيد الطلب.</p>

      <form id="order-form">
        <label for="name">الاسم واللقب</label>
        <input id="name" name="name" autocomplete="name"
          required maxlength="100">

        <label for="phone">رقم الهاتف</label>
        <input id="phone" name="phone" type="tel"
          autocomplete="tel" required maxlength="20"
          placeholder="05 أو 06 أو 07">

        <label for="wilaya">الولاية</label>
        <input id="wilaya" name="wilaya" required maxlength="60">

        <label for="commune">البلدية</label>
        <input id="commune" name="commune" required maxlength="100">

        <label for="address">العنوان بالتفصيل</label>
        <textarea id="address" name="address" required
          maxlength="300" rows="3"></textarea>

        <label for="quantity">الكمية</label>
        <select id="quantity" name="quantity">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>

        <button type="submit">تأكيد الطلب</button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer>© Nexora — جميع الحقوق محفوظة</footer>

 
<script>
  // Replace these two placeholders with your own Supabase values.
  const SUPABASE_URL = "https://dokyfulqacjbdsubmvop.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_7Nc4I-KNZ0FetDJuc2jp9A_GsRLjSoV";

  const form = document.getElementById("order-form");
  const status = document.getElementById("status");
  const submitButton = form.querySelector('button[type="submit"]');

  form.addEventListener("submit", async function (event) {
    event.preventDefault();

    if (submitButton.disabled) return;

    const originalButtonText = submitButton.textContent;
    submitButton.disabled = true;
    submitButton.textContent = "جاري إرسال الطلب...";
    status.textContent = "";
    status.style.color = "#171717";

    const payload = {
      customer_name: form.elements["name"].value.trim(),
      phone: form.elements["phone"].value.trim(),
      wilaya: form.elements["wilaya"].value.trim(),
      commune: form.elements["commune"].value.trim(),
      address: form.elements["address"].value.trim(),
      quantity: Number(form.elements["quantity"].value)
    };

    try {
      const response = await fetch(
        `${SUPABASE_URL.replace(/\/$/, "")}/functions/v1/create-order`,
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_PUBLISHABLE_KEY
          },
          body: JSON.stringify(payload)
        }
      );

      const result = await response.json();

      if (!response.ok || !result.success) {
        throw new Error(result.error || "تعذر تسجيل الطلب.");
      }

      status.style.color = "#16803c";
      status.textContent =
        `تم تسجيل طلبك بنجاح! رقم الطلب: ${result.order_id}. سيتواصل معك فريقنا لتأكيد الطلب.`;

      form.reset();
    } catch (error) {
      console.error("Nexora order submission failed:", error);
      status.style.color = "#b42318";
      status.textContent =
        "ما قدرناش نسجلو الطلب. تحقق من الإنترنت وحاول مرة أخرى.";
    } finally {
      submitButton.disabled = false;
      submitButton.textContent = originalButtonText;
    }
  });
</script>

</body>
</html>
